# Trade Helper na nuvem · configuração do Cloudflare Worker
# Publicado sozinho pelo GitHub Actions (.github/workflows/nuvem.yml)
# a cada push que mexe em nuvem/**. NÃO edite o código pelo painel da
# Cloudflare: o próximo push apaga a edição.
#
# Segredos (BOT_TOKEN, SENHA_SETUP, MEU_ID) NUNCA entram aqui: o repositório
# é público. Eles ficam só no Worker (Settings > Variables and Secrets) e o
# deploy não mexe neles.

# O nome precisa ser EXATAMENTE o do Worker que já existe. Se mudar,
# o deploy cria um Worker novo, sem os segredos.
name = "trade-helper"
# Número da conta Cloudflare. Não é segredo: sem o token não dá acesso a nada.
account_id = "8fdd4ee74ab0d5596af689841a9dea99"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Mantém as variáveis criadas no painel (os Secrets já são mantidos sempre).
keep_vars = true

[observability]
enabled = true

# Tarefas agendadas (horário UTC; o plano grátis permite 5 por conta):
# 1) a cada 5 min busca o catálogo do Rolimon's e guarda no KV; na primeira
#    rodada de cada hora também tira o retrato da hora;
# 2) Fase 1: nos minutos 2, 7, 12... lê a página de 1 item (vendas/dia e Best).
#    O texto tem que ser IGUAL ao CRON_LINHAS de src/linhas.js.
[triggers]
crons = ["*/5 * * * *", "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"]

# Armazenamento KV. O ID não é segredo (sem a chave da conta ele não serve
# para nada). Criado à mão no painel: Storage & Databases > KV > "TH".
[[kv_namespaces]]
binding = "TH"
id = "e11b47b12761461090d8e2bbd190d303"
