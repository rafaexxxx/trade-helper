# Publica o Trade Helper na nuvem (Cloudflare Worker) a cada push que mexe
# em nuvem/**. Também dá para rodar à mão: aba Actions > "Publicar nuvem" >
# Run workflow.
#
# Precisa de um Secret do repositório (Settings > Secrets and variables >
# Actions): CLOUDFLARE_API_TOKEN. O número da conta está no wrangler.toml.

name: Publicar nuvem

on:
  push:
    branches: [main]
    paths:
      - 'nuvem/**'
      - '.github/workflows/nuvem.yml'
  workflow_dispatch:

# Um deploy por vez; se vierem dois pushes seguidos, o segundo espera.
concurrency:
  group: nuvem-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publicar o Worker na Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: nuvem
          wranglerVersion: '4.136.3'
          command: deploy
